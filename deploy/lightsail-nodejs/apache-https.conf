# Enable only AFTER Certbot has issued the certificate for this hostname.
# Replace innovation.yourdomain.com in all three places.
<VirtualHost *:443>
    ServerName innovation.yourdomain.com
    DocumentRoot /var/www/innovation-certbot
    LimitRequestBody 3145728

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/innovation.yourdomain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/innovation.yourdomain.com/privkey.pem

    <Directory /var/www/innovation-certbot>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/
</VirtualHost>
