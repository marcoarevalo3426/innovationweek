# Replace innovation.yourdomain.com with your actual hostname.
server {
    listen 80;
    listen [::]:80;
    server_name innovation.yourdomain.com;

    # Allow the app's 2 MiB image plus multipart fields and headers.
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This configuration assumes Nginx is the single public reverse proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
