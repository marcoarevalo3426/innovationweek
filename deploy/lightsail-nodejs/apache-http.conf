# Replace innovation.yourdomain.com before enabling this virtual host.
<VirtualHost *:80>
    ServerName innovation.yourdomain.com
    DocumentRoot /var/www/innovation-certbot
    LimitRequestBody 3145728

    Alias /.well-known/acme-challenge/ /var/www/innovation-certbot/.well-known/acme-challenge/
    <Directory /var/www/innovation-certbot>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    # After installing the HTTPS virtual host, uncomment these three lines:
    # RewriteEngine On
    # RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    # RewriteRule ^ https://innovation.yourdomain.com%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>
