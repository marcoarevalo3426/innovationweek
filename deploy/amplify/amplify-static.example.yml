# Frontend-only hosting example. It does NOT deploy server/index.js or the
# Amplify Gen 2 resources under amplify/. Preserve any existing backend pipeline.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - npm ci --include=dev
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
